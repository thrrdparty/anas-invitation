<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ana's 21st Birthday</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 48px);
      background: radial-gradient(120% 90% at 50% 0%, #6d120b 0%, #560d07 55%, #3f0805 100%);
    }

    /* ---------- Wine frame ---------- */
    .frame {
      position: relative;
      width: min(560px, 100%);
      padding: clamp(24px, 6.5vw, 52px);
      background: #64100a url("assets/back.png") center / cover no-repeat;
      border-radius: 4px;
      box-shadow: 0 24px 60px rgba(0,0,0,.45), 0 4px 14px rgba(0,0,0,.35);
    }

    /* ---------- Cream paper panel ---------- */
    .panel {
      position: relative;
      background: #efe6d6 url("assets/background.png") center / cover no-repeat;
      padding: clamp(40px, 9vw, 66px) clamp(26px, 7vw, 52px) clamp(30px, 7vw, 48px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: inset 0 0 40px rgba(120, 70, 30, .10);
    }

    /* ---------- Wax seal ---------- */
    .seal {
      position: absolute;
      top: clamp(-48px, -9.5vw, -32px);
      left: 50%;
      transform: translateX(-50%);
      width: clamp(92px, 21vw, 124px);
      height: auto;
      z-index: 3;
      filter: drop-shadow(0 7px 10px rgba(0,0,0,.32));
    }

    /* ---------- Design pieces ---------- */
    .piece { display: block; height: auto; }

    .invited  { width: 62%;  margin-top: clamp(28px, 7vw, 40px); }
    .anas     { width: 52%;  margin-top: clamp(20px, 5vw, 30px); }
    .birthday { width: 88%;  margin-top: clamp(8px, 2vw, 14px); }
    .date     { width: 46%;  margin-top: clamp(24px, 6vw, 36px); }
    .cake     { width: 46%;  margin-top: clamp(26px, 6.5vw, 40px); }

    .divider {
      width: 58%;
      margin: clamp(22px, 5.5vw, 32px) 0 clamp(20px, 5vw, 30px);
      display: block;
    }

    .location-link { display: block; width: 66%; transition: opacity .2s ease; }
    .location-link:hover { opacity: .78; }
    .location { width: 100%; }

    .hint {
      margin-top: clamp(9px, 2.2vw, 13px);
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(12px, 3vw, 15px);
      letter-spacing: .03em;
      color: #8a2b2c;
      opacity: .8;
    }
  </style>
</head>
<body>
  <div class="frame">
    <!-- Wax seal with the "A" monogram -->
    <img class="seal" src="assets/seal.png" alt="wax seal" />

    <div class="panel">
      <img class="piece invited"  src="assets/invited.png"  alt="You are invited to" />
      <img class="piece anas"     src="assets/anas.png"     alt="Ana's" />
      <img class="piece birthday" src="assets/birthday.png" alt="21th Birthday" />
      <img class="piece date"     src="assets/date.png"     alt="12/07/2026 17:00" />
      <img class="piece cake"     src="assets/cake.png"     alt="Candles and cake" />

      <!-- Ornamental divider -->
      <svg class="divider" viewBox="0 0 300 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="none" stroke="#7d1418" stroke-width="1.4" stroke-linecap="round">
          <line x1="8" y1="12" x2="118" y2="12"/>
          <line x1="182" y1="12" x2="292" y2="12"/>
          <circle cx="8" cy="12" r="2.2" fill="#7d1418" stroke="none"/>
          <circle cx="292" cy="12" r="2.2" fill="#7d1418" stroke="none"/>
          <path d="M126 12 C132 6 140 6 146 12 C140 18 132 18 126 12 Z"/>
          <path d="M174 12 C168 6 160 6 154 12 C160 18 168 18 174 12 Z"/>
          <circle cx="150" cy="12" r="2.4" fill="#7d1418" stroke="none"/>
          <path d="M120 12 L126 12 M174 12 L180 12"/>
        </g>
      </svg>

      <!-- Location -> Google Maps -->
      <a class="location-link" href="https://maps.app.goo.gl/jkMc63fjMvfgcWo3A?g_st=ic" target="_blank" rel="noopener" title="Open in Google Maps">
        <img class="location" src="assets/location.png" alt="Location | Tsodoreti" />
      </a>
      <p class="hint">Tap the location for directions</p>
    </div>
  </div>
</body>
</html>
